name: AlgoNeo Build & Preflight CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Build & Code Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Verify Python Syntax
        run: |
          python -m py_compile app_server.py
          python -m py_compile scripts/preflight_check.py
          python -m py_compile trend_runner_paper.py
          python -m py_compile risk_guardian.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Web Dependencies
        run: |
          npm --prefix web install

      - name: Build Web Application
        run: |
          npm --prefix web run build
