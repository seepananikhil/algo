name: Daily Historical & Options Data Update

on:
  schedule:
    # Test cron: 22:47 IST (17:17 UTC) and 22:50 IST (17:20 UTC)
    - cron: '17 17 * * *'
    - cron: '20 17 * * *'
    # Primary: 16:15 IST (10:45 UTC) Monday through Friday
    - cron: '45 10 * * 1-5'
    # Backup: 17:00 IST (11:30 UTC) Monday through Friday
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Session date (YYYY-MM-DD), leave blank for today'
        required: false
        default: ''

jobs:
  update-data:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Python & Pip
        run: |
          which python3 || echo "python3 not found in PATH"
          python3 --version
          python3 -m pip --version || (python3 -m ensurepip --default-pip || curl -sS https://bootstrap.pypa.io/get-pip.py | python3)

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install DuckDB CLI
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            curl -LO https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-aarch64.zip
            unzip -o duckdb_cli-linux-aarch64.zip
          else
            curl -LO https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip
            unzip -o duckdb_cli-linux-amd64.zip
          fi
          mkdir -p "$HOME/.local/bin"
          mv duckdb "$HOME/.local/bin/" || sudo mv duckdb /usr/local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          duckdb --version

      - name: Update Spot Historical Data (NIFTY & SENSEX)
        env:
          NEO_CONSUMER_KEY: ${{ secrets.NEO_CONSUMER_KEY }}
          NEO_MOBILE_NUMBER: ${{ secrets.NEO_MOBILE_NUMBER }}
          NEO_UCC: ${{ secrets.NEO_UCC }}
          NEO_TOTP_KEY: ${{ secrets.NEO_TOTP_KEY }}
          NEO_MPIN: ${{ secrets.NEO_MPIN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.target_date }}"
          fi
          python3 scripts/update_spot_history.py $DATE_ARG

      - name: Fetch Weekly Options Data (NIFTY, SENSEX & BANKNIFTY)
        env:
          NEO_CONSUMER_KEY: ${{ secrets.NEO_CONSUMER_KEY }}
          NEO_MOBILE_NUMBER: ${{ secrets.NEO_MOBILE_NUMBER }}
          NEO_UCC: ${{ secrets.NEO_UCC }}
          NEO_TOTP_KEY: ${{ secrets.NEO_TOTP_KEY }}
          NEO_MPIN: ${{ secrets.NEO_MPIN }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.target_date }}"
          fi
          python3 scripts/fetch_weekly_options.py --index NIFTY $DATE_ARG || echo "Nifty options fetch completed or not an expiry session"
          python3 scripts/fetch_weekly_options.py --index SENSEX $DATE_ARG || echo "Sensex options fetch completed or not an expiry session"
          python3 scripts/fetch_weekly_options.py --index BANKNIFTY $DATE_ARG || echo "BankNifty options fetch completed or not an expiry session"

      - name: Rebuild DuckDB Options Parquet Catalogs
        run: |
          (cd options_data/nifty && duckdb -c ".read scripts/build_parquet.sql") || echo "Nifty parquet catalog build completed with warnings"
          (cd options_data/sensex && duckdb -c ".read scripts/build_parquet.sql") || echo "Sensex parquet catalog build completed with warnings"

      - name: Update Master Backtests
        run: |
          python3 run_10y_backtest.py || echo "Nifty backtest completed with warnings"
          python3 run_sensex_multiyear_trend_backtest.py || echo "Sensex backtest completed with warnings"
          python3 run_10y_midpoint_backtest.py || echo "Midpoint backtest completed with warnings"

      - name: Inspect Changed Data Files
        run: |
          git status --short historical_data/ options_data/

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): automated daily update of spot & options OHLC data"
          file_pattern: "historical_data/** options_data/** paper/** performance/**"
